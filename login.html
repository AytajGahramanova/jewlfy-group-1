<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - Login</title>
    <!-- Font Awesome CDN (İkonlar üçün) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <!-- Header / Breadcrumb Section -->
    <section class="gm__shop-header">
      <div class="gm__shop-header_container">
        <h1 class="gm__shop-header_title">Shop</h1>
        <nav class="gm__shop-header_breadcrumbs">
          <a class="gm__home" href="#">Home</a>
          <span class="gm__myaccount">/ My Account</span>
        </nav>
      </div>
    </section>

    <!-- Login Page - Gamar -->
    <section class="gm__login">
      <div class="gm__login-container">
        
        <div class="gm__login-banner">
          <img
            src="assets/login-img.jpg"
            alt="jewelry model"
            class="gm__login-banner-img"
          />
        </div>

        
        <div class="gm__login-form-wrapper">
          <h2 class="gm__login-title">Login</h2>
          <p class="gm__login-subtitle">
            Sign in to continue your jewelry journey
          </p>

          <form class="gm__login-form">
            <div class="gm__form-group">
              <label class="gm__form-label" for="username">
                Username or email address *
              </label>
              <input
                type="text"
                id="username"
                class="gm__form-input"
                placeholder="Enter your name or address"
                required
              />
            </div>

            <div class="gm__form-group">
              <label class="gm__form-label" for="password">Password *</label>
              <input
                type="password"
                id="password"
                class="gm__form-input"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="gm__form-options">
              <label class="gm__form-checkbox-label">
                <input type="checkbox" /> Remember me
              </label>
              <a href="#" class="gm__forgot-password-link">Forgot password?</a>
            </div>

            <button type="submit" class="gm__login-submit-btn">Log In</button>
          </form>

          <div class="gm__social-divider">Or continue with</div>

          <div class="gm__social-login-list">
            <button type="button" class="gm__social-login-btn">
              <i class="fab fa-facebook-f"></i>
            </button>
            <button type="button" class="gm__social-login-btn">
              <i class="fab fa-google"></i>
            </button>
            <button type="button" class="gm__social-login-btn">
              <i class="fab fa-apple"></i>
            </button>
          </div>

          <div class="gm__register-prompt">
            Don't have an account?
            <a href="#" class="gm__register-link">Create an account</a>
          </div>

          <p class="gm__security-note">Your data is protected & encrypted</p>
        </div>

      </div>
    </section>
  </body>
</html>
