<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewelry Store</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
</head>

<body>
  <header>
    <section class="rg-header-section1">
      <div class="rg-header-section1__container">
        <div class="rg-header-section1__icon">
          <i class="fa-brands fa-facebook-f"></i>
          <i class="fa-brands fa-linkedin-in"></i>
          <i class="fa-brands fa-instagram"></i>
        </div>

        <div class="rg-header-section1__center">
          <p class="rg_topbar_text">New arrivals just landed — explore the collection.. <a href="about.html">Discover
              Now!</a></p>
        </div>
        <div class="rg-header-section1__right">
          <div class="item">
            <i class="fa-regular fa-truck"></i>
            <span>Order Tracking</span>
          </div>

          <div class="item">
            <i class="fa-solid fa-location-dot"></i>
            <span>Store Location</span>
          </div>

          <div class="rg-header-section1__right__item__dropdown">
            <select class="language-select">
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="ar">Arabic</option>
            </select>
          </div>
        </div>
      </div>
    </section>
</body>

</html>
